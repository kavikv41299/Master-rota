<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Rota Manager</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- Inter -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
        }

        .scrollbar-thin::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .matrix-container {
            overflow-x: auto;
            overflow-y: auto;
            max-height: calc(100vh - 280px);
        }

        .matrix-table {
            border-collapse: separate;
            border-spacing: 0;
            min-width: max-content;
        }

        .matrix-table th,
        .matrix-table td {
            border-right: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
        }

        .matrix-table th:first-child,
        .matrix-table td:first-child {
            border-left: 1px solid #e2e8f0;
        }

        .matrix-header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #f8fafc;
        }

        .employee-cell {
            position: sticky;
            left: 0;
            z-index: 15;
            background: white;
            min-width: 220px;
            width: 220px;
        }

        .matrix-header .employee-cell {
            z-index: 30;
            background: #f1f5f9;
        }

        .day-header {
            min-width: 125px;
            width: 125px;
        }

        /* =====================================================
           MANAGEMENT SHIFT TABLE
        ====================================================== */

        .management-shift-container {
            overflow-x: auto;
            overflow-y: hidden;
        }

        .management-shift-table {
            border-collapse: separate;
            border-spacing: 0;
            min-width: max-content;
            width: 100%;
        }

        .management-shift-table th,
        .management-shift-table td {
            border-right: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
        }

        .management-shift-table th:first-child,
        .management-shift-table td:first-child {
            border-left: 1px solid #e2e8f0;
        }

        .management-shift-table .management-name-cell {
            position: sticky;
            left: 0;
            z-index: 10;
            background: white;
            min-width: 220px;
            width: 220px;
        }

        .management-shift-table thead th {
            position: sticky;
            top: 0;
            z-index: 5;
            background: #f8fafc;
        }

        .management-shift-table thead th:first-child {
            z-index: 15;
            background: #f1f5f9;
        }

        .management-day-header {
            min-width: 125px;
            width: 125px;
        }

        .management-shift-cell {
            min-width: 125px;
            width: 125px;
            padding: 6px;
        }

        /* =====================================================
           SELECTS
        ====================================================== */

        .rota-select,
        .shift-modal-select {
            width: 100%;
            padding: 7px 28px 7px 8px;
            border: 2px solid #cbd5e1;
            border-radius: 7px;
            background: white;
            color: #475569;
            font-size: 12px;
            font-weight: 700;
            outline: none;
            transition: all 0.15s ease;
            cursor: pointer;
        }

        .shift-modal-select {
            padding: 9px 30px 9px 10px;
            font-size: 13px;
            border-radius: 8px;
        }

        .rota-select:focus,
        .shift-modal-select:focus {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* =====================================================
           SHIFT COLOURS
        ====================================================== */

        .shift-blank {
            background: #ffffff !important;
            color: #475569 !important;
            border-color: #cbd5e1 !important;
        }

        .shift-Early {
            background: #16a34a !important;
            color: #ffffff !important;
            border-color: #15803d !important;
        }

        .shift-Mid {
            background: #f59e0b !important;
            color: #ffffff !important;
            border-color: #d97706 !important;
        }

        .shift-Late {
            background: #7c3aed !important;
            color: #ffffff !important;
            border-color: #6d28d9 !important;
        }

        .shift-Early-finish-Early-shift {
            background: #06b6d4 !important;
            color: #ffffff !important;
            border-color: #0891b2 !important;
        }

        .shift-Late-start-Early-shift {
            background: #0d9488 !important;
            color: #ffffff !important;
            border-color: #0f766e !important;
        }

        .shift-Early-finish-Late-shift {
            background: #ec4899 !important;
            color: #ffffff !important;
            border-color: #db2777 !important;
        }

        .shift-Late-start-Late-shift {
            background: #f43f5e !important;
            color: #ffffff !important;
            border-color: #e11d48 !important;
        }

        .shift-Doctors-appointment {
            background: #2563eb !important;
            color: #ffffff !important;
            border-color: #1d4ed8 !important;
        }

        .shift-Dont-work {
            background: #dc2626 !important;
            color: #ffffff !important;
            border-color: #b91c1c !important;
        }

        .shift-Dependancy-leave {
            background: #ea580c !important;
            color: #ffffff !important;
            border-color: #c2410c !important;
        }

        .shift-Holiday {
            background: #eab308 !important;
            color: #ffffff !important;
            border-color: #ca8a04 !important;
        }

        .shift-WFH {
            background: #059669 !important;
            color: #ffffff !important;
            border-color: #047857 !important;
        }

        .shift-FW {
            background: #0891b2 !important;
            color: #ffffff !important;
            border-color: #0e7490 !important;
        }

        .shift-Flexi-Time-taken {
            background: #9333ea !important;
            color: #ffffff !important;
            border-color: #7e22ce !important;
        }

        .shift-Flexi-time-redeem {
            background: #4f46e5 !important;
            color: #ffffff !important;
            border-color: #4338ca !important;
        }

        .weekend-cell {
            background: #f8fafc;
        }

        .today-cell {
            background: #eff6ff;
        }

        /* =====================================================
           MANAGEMENT TABLE
        ====================================================== */

        .management-card {
            border: 1px solid #e2e8f0;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        .management-header {
            background: #0f172a;
            color: white;
        }

        .management-section-header {
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .management-person {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
        }

        .management-avatar {
            width: 34px;
            height: 34px;
            min-width: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
        }

        /* =====================================================
           WEEKEND TABLE
        ====================================================== */

        .weekend-table {
            width: 100%;
            border-collapse: collapse;
        }

        .weekend-table th,
        .weekend-table td {
            border-bottom: 1px solid #e2e8f0;
            padding: 10px 14px;
            text-align: left;
        }

        .weekend-table th {
            background: #f8fafc;
            color: #475569;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 800;
        }

        .weekend-table td {
            font-size: 13px;
            color: #334155;
        }

        .weekend-count {
            display: inline-flex;
            min-width: 32px;
            height: 28px;
            align-items: center;
            justify-content: center;
            border-radius: 7px;
            font-weight: 800;
        }

        .saturday-count {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .sunday-count {
            background: #ede9fe;
            color: #6d28d9;
        }

        .total-weekend-count {
            background: #f1f5f9;
            color: #334155;
        }

        /* =====================================================
           DATE INPUT
        ====================================================== */

        .date-input {
            width: 100%;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            padding: 9px 10px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            outline: none;
        }

        .date-input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
        }

        /* =====================================================
           MODALS
        ====================================================== */

        .modal-backdrop {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(3px);
        }

        /* =====================================================
           TOAST
        ====================================================== */

        .toast {
            transition: all 0.3s ease;
        }

        .toast.hidden {
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }

        .toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media print {

            body {
                background: white !important;
            }

            header,
            .no-print,
            button,
            input,
            select {
                display: none !important;
            }

            .matrix-container {
                max-height: none !important;
                overflow: visible !important;
            }

            .employee-cell,
            .management-name-cell {
                position: static !important;
            }

        }

    </style>
</head>
